<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranjit AI Assistant</title>

    <link rel="stylesheet" href="agenti.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="chat-card">

        <div class="header">

            <div>

                <h2>🤖 Ranjit AI</h2>

                <p>Ask anything about my portfolio</p>

            </div>

            <span class="status">
                ● Online
            </span>

        </div>

        <div id="chatBox" class="chat-box">

            <div class="bot-message">

                👋 Hello! I'm Ranjit's AI Assistant.

                Ask me about

                <ul>

                    <li>Skills</li>

                    <li>Projects</li>

                    <li>Education</li>

                    <li>Experience</li>

                </ul>

            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userMessage"
                placeholder="Ask anything..."
            >

            <button id="sendBtn">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
